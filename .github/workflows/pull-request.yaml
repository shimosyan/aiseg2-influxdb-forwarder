name: Pull Request

on:
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # デプロイしないため PR レベルの排他制御
  cancel-in-progress: true # PR の更新があった場合は前のジョブをキャンセルする

permissions: {}

jobs:
  status-check:
    needs:
      - document-test
      - update-aqua-checksums
      - update-actions-lock
      - build
    runs-on: ubuntu-latest
    permissions: {}

    if: failure()
    steps:
      - run: exit 1

  document-test:
    uses: shimosyan/.github/.github/workflows/wc-document-pull-request.yaml@d2c775546e84981c2b238f9a7fe69a7eae74cb37 # main
    secrets: inherit
    permissions:
      id-token: write
      contents: read
      pull-requests: write

  update-aqua-checksums:
    uses: shimosyan/.github/.github/workflows/wc-update-aqua-checksums.yaml@d2c775546e84981c2b238f9a7fe69a7eae74cb37 # main
    secrets: inherit
    permissions:
      id-token: write
      contents: read
      pull-requests: write

  update-actions-lock:
    uses: shimosyan/.github/.github/workflows/wc-update-actions-lock.yaml@d2c775546e84981c2b238f9a7fe69a7eae74cb37 # main
    secrets: inherit
    permissions:
      id-token: write
      contents: read
      pull-requests: write

  build:
    uses: ./.github/workflows/wc-build.yaml
    secrets:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
